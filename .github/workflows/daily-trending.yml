name: 每日 GitHub Trending 推送

on:
  schedule:
    # UTC 4:17 = 北京时间 12:17；避开整点的 GitHub Actions 高峰
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: daily-github-trending
  cancel-in-progress: false

jobs:
  scrape-push-and-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 拉取推送项目
        uses: actions/checkout@v4

      - name: 🗂️ 拉取 Obsidian Vault 私库
        uses: actions/checkout@v4
        with:
          repository: Big-Light/github-trending-obsidian
          ref: master
          token: ${{ secrets.OBSIDIAN_REPO_TOKEN }}
          path: .vault

      - name: 🟢 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 📦 安装依赖
        run: npm ci

      - name: 🚀 爬取、去重并推送到 QQ
        env:
          QQ_BOT_APP_ID: ${{ secrets.QQ_BOT_APP_ID }}
          QQ_BOT_APP_SECRET: ${{ secrets.QQ_BOT_APP_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRENDING_ARCHIVE_DIR: .vault
          DEDUP_DAYS: '7'
        run: node src/index.js

      - name: 💾 保存完整榜单到 Vault 私库
        if: always()
        working-directory: .vault
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Vault 没有变化"
            exit 0
          fi
          git commit -m "archive: GitHub Trending $(date -u +'%Y-%m-%d')"
          git push origin HEAD:master
