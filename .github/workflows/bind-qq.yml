name: 绑定 QQ 机器人私聊

on:
  workflow_dispatch:

concurrency:
  group: bind-qq-bot
  cancel-in-progress: true

jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: 📥 拉取推送项目
        uses: actions/checkout@v4

      - name: 🗂️ 拉取 Obsidian Vault 私库
        uses: actions/checkout@v4
        with:
          repository: Big-Light/github-trending-obsidian
          ref: master
          token: ${{ secrets.OBSIDIAN_REPO_TOKEN }}
          path: .vault

      - name: 🟢 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 📦 安装依赖
        run: npm ci

      - name: 🔗 等待手机 QQ 绑定消息
        env:
          QQ_BOT_APP_ID: ${{ secrets.QQ_BOT_APP_ID }}
          QQ_BOT_APP_SECRET: ${{ secrets.QQ_BOT_APP_SECRET }}
          TRENDING_ARCHIVE_DIR: .vault
        run: node src/bind-qq.js --timeout 180

      - name: 🔒 将绑定信息保存到 Vault 私库
        working-directory: .vault
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github-trending/qq-target.json
          git commit -m "config: bind QQ private chat target"
          git push origin HEAD:master
